<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🏠 House Price Prediction</h1>

            <p class="subtitle">
                Machine Learning + FastAPI
            </p>


            <form id="predictionForm">

                <!-- Area -->

                <label for="area">
                    Area (sq.ft)
                </label>

                <input
                    type="number"
                    id="area"
                    placeholder="Example: 1500"
                    min="1"
                    required
                >


                <!-- Bedrooms -->

                <label for="bedrooms">
                    Bedrooms
                </label>

                <input
                    type="number"
                    id="bedrooms"
                    placeholder="Example: 3"
                    min="1"
                    required
                >


                <!-- Bathrooms -->

                <label for="bathrooms">
                    Bathrooms
                </label>

                <input
                    type="number"
                    id="bathrooms"
                    placeholder="Example: 2"
                    min="1"
                    required
                >


                <!-- Floors -->

                <label for="floors">
                    Floors
                </label>

                <input
                    type="number"
                    id="floors"
                    placeholder="Example: 2"
                    min="1"
                    required
                >


                <!-- Age -->

                <label for="age">
                    House Age (years)
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Example: 5"
                    min="0"
                    required
                >


                <button type="submit">
                    Predict House Price
                </button>

            </form>


            <!-- Result -->

            <div id="result"
                 class="result">

            </div>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
